<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Modelo 3D</title>

  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    /* Remove as margens para a câmera ocupar a tela toda e esconde barras de rolagem */
    body {
      margin: 0;
      overflow: hidden;
    }
  </style>
</head>

<body>

  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    
    <a-assets>
      <a-asset-item id="meu-modelo" src="Teste.glb"></a-asset-item>
    </a-assets>

    <a-maker preset="hiro">
    <!--a-marker type="pattern" url="meu-marcador.patt"-->
      
      <a-entity 
        gltf-model="#meu-modelo" 
        scale="1 1 1" 
        position="0 0 0" 
        rotation="-90 0 0">
      </a-entity>

   <!a-marker 
      type="pattern" 
      url="meu-marcador.patt"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"-->

     <a-marker 
        preset="hiro" 
        smooth="true" 
        smoothCount="10" 
        smoothTolerance="0.01" 
        smoothThreshold="5">
       
      <a-entity 
        gltf-model="#meu-modelo" 
        scale="1 1 1" 
        position="0 0 0" 
        rotation="-90 0 0">
      </a-entity>

    </a-marker>

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
