<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <!-- A tag viewport abaixo é crucial para responsividade no celular -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Modelo</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    /* Resetando altura e margens para mobile */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%; /* Resolve o bug da barra do navegador engolir o botão */
      background-color: #222222;
      overflow: hidden; 
    }

    /* O viewer agora respeita o tamanho exato da tela visível */
    model-viewer {
      width: 100%;
      height: 100%;
      background-color: transparent;
      display: block;
    }

    /* Botão centralizado e responsivo */
    .botao-ar-customizado {
      background-color: #ffffff;
      color: #333333;
      border: none;
      border-radius: 8px;
      
      /* Centralização na parte inferior */
      position: absolute;
      bottom: 30px; /* Distância segura do fundo da tela */
      left: 50%;
      transform: translateX(-50%); /* Puxa o botão de volta para o centro exato */
      
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      white-space: nowrap; /* Impede que o texto quebre em duas linhas em telas finas */
      z-index: 100; /* Garante que nada fique por cima dele */
    }

    .botao-ar-customizado:active {
      background-color: #e0e0e0;
    }
  </style>
</head>

<body>

<model-viewer
  src="Teste.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate>
  
  <button slot="ar-button" class="botao-ar-customizado">
    📸 Ver no meu espaço
  </button>

</model-viewer>

</body>
</html>
