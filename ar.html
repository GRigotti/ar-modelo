<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Modelo</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    /* Trava o fundo e impede qualquer rolagem da tela */
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100dvh; /* dvh se adapta dinamicamente à tela do celular */
      background-color: #222222;
      overflow: hidden; 
    }

    /* Trava o visualizador exatamente nas bordas da tela */
    model-viewer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100dvh;
      background-color: transparent;
      display: block;
    }

    /* Botão blindado contra o carregamento do modelo */
    .botao-ar-customizado {
      background-color: #ffffff;
      color: #333333;
      border: none;
      border-radius: 8px;
      
      /* Posicionamento super fixo */
      position: absolute !important;
      bottom: 40px !important; /* Espaço seguro do fundo */
      left: 50% !important;
      transform: translateX(-50%) !important;
      margin: 0 !important; /* Evita que margens do Google afetem o botão */
      
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      cursor: pointer;
      white-space: nowrap;
      z-index: 9999 !important; /* Força a ficar na frente de tudo */
    }

    .botao-ar-customizado:active {
      background-color: #e0e0e0;
    }
  </style>
</head>

<body>

<model-viewer
  src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  auto-rotate>
  
  <button slot="ar-button" class="botao-ar-customizado">
    📸 Ver no meu espaço
  </button>

</model-viewer>

</body>
</html>
