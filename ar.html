<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Hiro Estável</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <style>
  body { margin: 0; overflow: hidden; }
  
  /* Força a cena a ocupar a tela toda */
  .a-canvas {
    width: 100% !important;
    height: 100% !important;
  }
</style>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene 
   embedded 
  vr-mode-ui="enabled: false;"
  renderer="logarithmicDepthBuffer: true; precision: medium;"
  arjs="sourceType: webcam; 
        sourceWidth: 640; 
        sourceHeight: 480; 
        displayWidth: 640; 
        displayHeight: 480; 
        debugUIEnabled: false;">
    
    <a-assets>
      <a-asset-item id="meu-modelo" src="Teste.glb"></a-asset-item>
    </a-assets>

    <a-marker 
      type="pattern" 
      url="icone.patt"
      smooth="true" 
      smoothCount="10" 
      smoothTolerance="0.01" 
      smoothThreshold="5">
        
        <a-entity 
            gltf-model="#meu-modelo" 
            scale="0.5 0.5 0.5" 
            position="0 0 0" 
            rotation="0 0 0">
        </a-entity>
        
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
