<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Hiro Estável</title>
  
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">

  <a-scene 
    embedded 
    renderer="logarithmicDepthBuffer: true;"
    arjs="sourceType: webcam; sourceWidth:1280; sourceHeight:720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
    
    <a-assets>
      <a-asset-item id="meu-modelo" src="Teste.glb"></a-asset-item>
    </a-assets>

    <a-marker 
        <a-marker 
      type="pattern" 
      url="icone.patt"
      smooth="true" 
      smoothCount="10" 
      smoothTolerance="0.01" 
      smoothThreshold="5">
        
        <a-entity 
            gltf-model="#meu-modelo" 
            scale="0.5 0.5 0.5" 
            position="0 0 0" 
            rotation="0 0 0">
        </a-entity>
        
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
