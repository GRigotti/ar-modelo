<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Hiro Estável</title>

  <style>
  body { margin: 0; overflow: hidden; }
  .a-canvas {
    width: 100vw !important;
    height: 100vh !important;
  }
  </style>
  
  <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
<a-scene
    embedded 
    arjs="sourceType: webcam; sourceWidth:1280; sourceHeight:720; displayWidth: 1280; displayHeight: 720; debugUIEnabled: false;">
    
    <a-assets>
      <a-asset-item id="meu-modelo" src="Teste.glb"></a-asset-item>
    </a-assets>

    <a-marker 
        preset="hiro"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">
        
      <a-entity 
        gltf-model="#meu-modelo" 
        scale="1 1 1" 
        position="0 0 0" 
        rotation="-90 0 0">
      </a-entity>
      
    </a-marker>

    <a-entity camera></a-entity>

   
</body>
</html>
