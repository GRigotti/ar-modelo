<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Modelo</title>

  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <style>
    /* Remove as margens e define um fundo cinza escuro */
    body {
      margin: 0;
      background-color: #222222;
      overflow: hidden; /* Evita barra de rolagem */
    }

    /* Faz o visualizador ocupar a tela toda */
    model-viewer {
      width: 100%;
      height: 100vh;
      background-color: transparent;
    }

    /* Estilo do nosso botão customizado de AR */
    .botao-ar-customizado {
      background-color: #ffffff;
      color: #333333;
      border: none;
      border-radius: 8px;
      position: absolute;
      bottom: 32px;
      right: 32px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
      box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
      cursor: pointer;
    }

    .botao-ar-customizado:active {
      background-color: #e0e0e0;
    }
  </style>
</head>

<body>

<model-viewer
  src="Teste.glb"
  ar
  ar-modes="scene-viewer webxr quick-look"
  camera-controls
  auto-rotate>
  
  <button slot="ar-button" class="botao-ar-customizado">
    📸 Ver no meu espaço
  </button>

</model-viewer>

</body>
</html>
